<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
    <script>
      // Sveltia falls back to a direct view swap when this API is unavailable.
      // Its snapshots can flash across the editor during local navigation.
      Object.defineProperty(document, 'startViewTransition', { value: undefined });
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
