[tools]
node = "22.23.1"
python = "3.14.6"

[env]
# Scraper dependencies live outside the repo. `python -m venv` is unusable on
# this machine (no ensurepip), so they install to a gitignored cache instead.
PY_LIBS = "{{config_root}}/.cache/py-libs"

# --- Everyday ---------------------------------------------------------------

[tasks.install]
description = "Install Node dependencies"
run = "npm install"

[tasks.dev]
description = "Start the dev server on http://localhost:4321"
run = "npm run dev"

[tasks.build]
description = "Build the static site into dist/"
run = "npm run build"

[tasks.preview]
description = "Serve the built site locally for review"
depends = ["build"]
run = "npm run preview"

[tasks.sync]
description = "Regenerate content collection types after a schema change"
run = "npx astro sync"

[tasks.clean]
description = "Remove build output and generated types"
run = "rm -rf dist .astro"

# --- Verification -----------------------------------------------------------
# These mirror .github/workflows/ci.yml. `mise run ci` runs what CI runs, so a
# green local run should mean a green pipeline.

[tasks.verify]
description = "Check every live-site URL resolves to a route or a redirect"
depends = ["build"]
run = "python scripts/verify-redirects.py"

[tasks."verify:live"]
description = "Same as verify, but against the live sitemap instead of the snapshot"
depends = ["build"]
run = "python scripts/verify-redirects.py --live"

[tasks.alt]
description = "Check every content image has alt text"
run = "python scripts/apply-alt-text.py --check"

[tasks.placeholders]
description = "Fail if unresolved Astro image placeholders reached the build"
depends = ["build"]
run = """
if grep -rq "__ASTRO_IMAGE_" dist/; then
  echo "Unresolved __ASTRO_IMAGE_ in dist/ - render markdown via <Content />, not set:html:"
  grep -rlo "__ASTRO_IMAGE_" dist/
  exit 1
fi
echo "No unresolved image placeholders."
"""

[tasks.a11y]
description = "WCAG 2.1 AA audit of every route with pa11y (needs Chrome)"
depends = ["build"]
# `astro preview` daemonises with --background, so stop any stale server first:
# a leftover one on another port silently serves an old build and the audit
# reports on stale HTML.
run = """
npx astro preview stop >/dev/null 2>&1 || true
npx astro preview --background --port 4321
npx wait-on http://localhost:4321 --timeout 60000
npx pa11y-ci --config .pa11yci.json
STATUS=$?
npx astro preview stop >/dev/null 2>&1 || true
exit $STATUS
"""

[tasks.ci]
description = "Everything CI runs: build, alt text, placeholders, redirects, a11y"
run = [
  "mise run build",
  "mise run alt",
  "mise run placeholders",
  "mise run verify",
  "mise run a11y",
]

# --- Content migration ------------------------------------------------------
# Only needed when re-pulling from the live site. Day-to-day editing happens in
# src/content/ or through the CMS, not here.

[tasks."deps:py"]
description = "Install scraper dependencies into .cache/py-libs"
run = "pip install --quiet --target $PY_LIBS requests beautifulsoup4 markdownify"

[tasks.scrape]
description = "Re-fetch washcobikes.org into .cache/scrape/ and src/assets/images/"
depends = ["deps:py"]
run = "PYTHONPATH=$PY_LIBS python scripts/scrape.py"

[tasks.content]
description = "Regenerate src/content/ from the scrape cache"
depends = ["deps:py"]
run = "PYTHONPATH=$PY_LIBS python scripts/generate-content.py"

[tasks.refresh]
description = "Full content refresh: scrape the live site, then regenerate content"
run = ["mise run scrape", "mise run content"]
